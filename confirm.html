<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm your email · StoryLooks</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="narrow">
  <header class="top"><a class="wordmark" href="./">STORYLOOKS</a></header>
  <div class="panel center">
    <h1 style="font-size:36px;" id="title">Confirming…</h1>
    <p class="muted" id="text">One moment.</p>
    <div id="msg" class="hidden" role="status"></div>
    <button class="btn hidden" id="retry">Try again</button>
  </div>
</div>
<script src="assets/app.js"></script>
<script>
  // Confirms as soon as the page opens, so one tap on the email button is enough.
  const t = param('t');
  const title = document.getElementById('title');
  const text = document.getElementById('text');
  const retry = document.getElementById('retry');
  async function confirmEmail() {
    if (!t) { title.textContent = 'Something is missing'; text.textContent = 'Use the button in your confirmation email.'; return; }
    retry.classList.add('hidden');
    const r = await postJSON('account', { t, action: 'confirm' }).catch(() => ({ ok: false }));
    if (r.ok) {
      title.textContent = "You're in!";
      text.textContent = r.message;
    } else {
      title.textContent = "That didn't work";
      text.textContent = r.message || 'Check your connection and try again.';
      retry.classList.remove('hidden');
    }
  }
  retry.addEventListener('click', confirmEmail);
  confirmEmail();
</script>
</body>
</html>
