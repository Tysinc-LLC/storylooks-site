<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your feedback · StoryLooks</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="narrow">
  <header class="top"><a class="wordmark" href="./">STORYLOOKS</a></header>
  <form class="panel" id="week">
    <h1 style="font-size:34px;" id="hello">How did we do?</h1>
    <p class="muted">About 30 seconds. Answer whatever you like and skip the rest.</p>

    <div id="looks"></div>

    <h3 style="margin:22px 0 6px;">What's coming up this week?</h3>
    <div class="choice" style="margin:10px 0 4px;" id="ideas">
      <label><input type="checkbox" value="Work as usual"><span>Work as usual</span></label>
      <label><input type="checkbox" value="A game"><span>A game</span></label>
      <label><input type="checkbox" value="Church"><span>Church</span></label>
      <label><input type="checkbox" value="Date night"><span>Date night</span></label>
      <label><input type="checkbox" value="A party"><span>A party</span></label>
      <label><input type="checkbox" value="Travel"><span>Travel</span></label>
      <label><input type="checkbox" value="Outdoors"><span>Outdoors</span></label>
      <label><input type="checkbox" value="Family time"><span>Family time</span></label>
    </div>
    <label for="text">Anything else? <span class="muted">(optional)</span></label>
    <textarea id="text" maxlength="400" placeholder="e.g. Friend's wedding Saturday, outdoor job site Tuesday, kids' basketball on Thursday"></textarea>

    <div id="questions"></div>

    <div id="msg" class="hidden" role="status"></div>
    <button class="btn" id="send" type="submit" style="width:100%;margin-top:18px;">Send</button>
  </form>
</div>
<script src="assets/app.js"></script>
<script>
  const t = param('t');
  const form = document.getElementById('week');
  const msg = document.getElementById('msg');
  const send = document.getElementById('send');
  const box = document.getElementById('questions');
  const looksBox = document.getElementById('looks');
  let questions = [];

  const el = (tag, cls, text) => { const x = document.createElement(tag); if (cls) x.className = cls; if (text) x.textContent = text; return x; };

  // One row of rating buttons. A tap fills the button in and saves right away; no page change.
  function ratingRow(look, q, choices, current, round) {
    const row = el('div', 'pills');
    const saved = el('span', 'saved', 'Saved');
    for (const c of choices) {
      const b = el('button', `pill${round ? ' round' : ''}${current === c ? ' on' : ''}`, c);
      b.type = 'button';
      b.addEventListener('click', async () => {
        row.querySelectorAll('.pill').forEach((x) => x.classList.toggle('on', x === b));
        saved.classList.remove('show');
        const r = await postJSON('account', { t, action: 'rate', look: look.id, q, a: c }).catch(() => ({ ok: false }));
        saved.textContent = r.ok ? 'Saved' : 'Not saved, tap again';
        saved.classList.add('show');
        if (q === 'looks_like_me') look.tip.classList.toggle('hidden', !(r.ok && Number(c) <= 2));
      });
      row.appendChild(b);
    }
    row.appendChild(saved);
    return row;
  }

  function showLooks(looks) {
    for (const look of looks) {
      const card = el('div', 'rate-look');
      card.appendChild(el('h3', '', look.title));
      if (look.image) { const img = el('img'); img.src = look.image; img.alt = look.title; img.loading = 'lazy'; card.appendChild(img); }
      card.appendChild(el('div', 'rate-q', 'Does this look like you? (1 = not at all, 5 = that\'s me)'));
      look.tip = el('p', 'fine hidden');
      look.tip.innerHTML = `Sorry that one missed. A few more photos of you usually help a lot. <a href="manage.html?t=${encodeURIComponent(t)}#photos">Add photos</a>`;
      card.appendChild(ratingRow(look, 'looks_like_me', ['1', '2', '3', '4', '5'], look.looks_like_me, true));
      card.appendChild(look.tip);
      card.appendChild(el('div', 'rate-q', 'Would you wear it?'));
      card.appendChild(ratingRow(look, 'would_wear', ['Yes', 'Maybe', 'No'], look.would_wear, false));
      looksBox.appendChild(card);
    }
    if (looks.length) {
      const h = el('h2', '', "Help shape next week's looks");
      h.style.margin = '30px 0 0';
      looksBox.appendChild(h);
    }
  }

  // A few quick questions this person hasn't answered yet (some allow more than one pick).
  postJSON('account', { t, action: 'info', i: param('i') }).then((r) => {
    if (!r.ok) { showMessage(msg, r.message || 'This link is missing something. Use the link in your latest StoryLooks email.', false); return; }
    const looks = r.looks || [];
    document.getElementById('hello').textContent = looks.length ? `How did we do, ${r.name}?` : `Help shape next week's looks, ${r.name}`;
    showLooks(looks);
    questions = r.questions || [];
    for (const q of questions) {
      const block = document.createElement('div');
      const h = document.createElement('h3');
      h.style.margin = '22px 0 6px';
      h.textContent = q.text;
      block.appendChild(h);
      if (q.many) {
        const hint = document.createElement('p');
        hint.className = 'fine';
        hint.style.margin = '0';
        hint.textContent = 'Pick any that fit.';
        block.appendChild(hint);
      }
      const row = document.createElement('div');
      row.className = 'choice';
      row.style.marginTop = '10px';
      for (const c of q.choices) {
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = q.many ? 'checkbox' : 'radio';
        input.name = q.id;
        input.value = c;
        const span = document.createElement('span');
        span.textContent = c;
        label.append(input, span);
        row.appendChild(label);
      }
      block.appendChild(row);
      box.appendChild(block);
    }
  }).catch(() => {});

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const picks = [...document.querySelectorAll('#ideas input:checked')].map((i) => i.value);
    const extra = document.getElementById('text').value.trim();
    const text = [picks.join(', '), extra].filter(Boolean).join('. ');
    const answers = {};
    for (const q of questions) {
      const chosen = [...document.querySelectorAll(`input[name="${q.id}"]:checked`)].map((i) => i.value);
      if (chosen.length) answers[q.id] = chosen;
    }
    if (!text && !Object.keys(answers).length) {
      // Ratings save as they're tapped, so Send with nothing else filled in is fine too.
      const rated = document.querySelector('.pill.on');
      showMessage(msg, rated ? 'Thanks! Your ratings are saved.' : 'Pick something or type a few words first.', Boolean(rated));
      return;
    }
    send.disabled = true;
    const r = await postJSON('account', { t, action: 'week', text, answers }).catch(() => ({ ok: false }));
    showMessage(msg, r.message || 'Something went wrong. Please try again.', r.ok);
    if (r.ok) send.classList.add('hidden'); else send.disabled = false;
  });
</script>
</body>
</html>
